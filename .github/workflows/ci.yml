name: CI
 
on: push
 
jobs:
  test:
    # A fresh Linux machine from GitHub, empty except for the tools
    # GitHub installs on it. Nothing from your laptop is on it.
    runs-on: ubuntu-latest
 
    steps:
      # Copies this repo, at the commit that was pushed, onto the machine.
      - uses: actions/checkout@v7
 
      # Installs Node 24 and keeps npm's download cache between runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
 
      # Installs exactly what package-lock.json lists. node_modules is
      # in .gitignore, so it is not in the repo for checkout to copy.
      - run: npm ci
 
      # The three test files. No secrets: vite.config.ts gives the
      # tests their own VITE_API_URL, and they never call the API.
      - run: npm test

      # Type-check and build the same frontend that Vercel deploys.
      - run: npm run build
